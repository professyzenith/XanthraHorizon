name: Daily Intelligence Briefing Cron

on:
  schedule:
    # Run every 30 minutes to catch timezones with 30-min offsets (like India IST)
    - cron: '0,30 * * * *'
  # Allow manual triggering from GitHub UI
  workflow_dispatch:

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Daily Intelligence Briefing
        run: |
          curl -s -X POST "${{ secrets.APP_URL }}/api/send-briefing" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

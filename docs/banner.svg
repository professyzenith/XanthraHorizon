<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <!-- Definitions for gradients and filters -->
  <defs>
    <!-- Dark premium background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="50%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#111211" />
    </linearGradient>

    <!-- Gold gradient for text and accents -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2C873" />
      <stop offset="50%" stop-color="#C9A853" />
      <stop offset="100%" stop-color="#9C7F33" />
    </linearGradient>

    <!-- Subtle blue/cyan gradient for tech vibe -->
    <linearGradient id="techGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#1a2a3a" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glowing effect for the horizon line -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.03" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGradient)" />
  <rect width="1200" height="400" fill="url(#techGradient)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Abstract Horizon / Network Graphics -->
  <g opacity="0.6">
    <!-- Glowing horizon line -->
    <path d="M 0 250 Q 600 150 1200 250" fill="none" stroke="url(#goldGradient)" stroke-width="2" filter="url(#glow)" opacity="0.5" />
    <path d="M 0 250 Q 600 150 1200 250" fill="none" stroke="#E2C873" stroke-width="1" opacity="0.8" />
    
    <!-- Data lines -->
    <path d="M 0 280 Q 600 200 1200 280" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.05" />
    <path d="M 0 310 Q 600 250 1200 310" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.05" />
  </g>

  <!-- Center Text Content -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="600" y="195" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="url(#goldGradient)" letter-spacing="4">
      XANTHRA HORIZON
    </text>

    <!-- Subtitle -->
    <text x="600" y="245" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#A0A0A0" letter-spacing="8">
      PREMIUM GLOBAL INTELLIGENCE
    </text>
  </g>
</svg>
